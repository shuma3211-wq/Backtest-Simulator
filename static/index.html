<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FX Simulator</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden}body{background:#0f1117;color:#e7e9ee;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}header{height:52px;flex:0 0 52px;border-bottom:1px solid #2a2e38;display:flex;align-items:center;padding:0 14px;gap:12px}header b{white-space:nowrap}.muted{color:#8f98aa;font-size:12px}.tfbar{display:flex;gap:5px;margin-left:auto;min-width:0}.tfbar button{width:auto;min-width:48px;padding:7px 10px;margin:0}.tfbar button.active{background:#2b6ff3;border-color:#2b6ff3}.tfbar button.unavailable{opacity:.45}main{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 350px}#chart{min-width:0;min-height:0;position:relative;background:#0f1117;overflow:hidden;cursor:grab;touch-action:none}#canvas{width:100%;height:100%;display:block}.chart-info{position:absolute;left:10px;top:8px;z-index:5;background:#151922cc;padding:5px 8px;border:1px solid #2d3340;border-radius:6px;font-size:10px;color:#aeb5c3;pointer-events:none}.side{border-left:1px solid #2a2e38;padding:12px;overflow:auto;-webkit-overflow-scrolling:touch}.section{border-bottom:1px solid #252a34;padding-bottom:10px;margin-bottom:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}button,input,select{width:100%;min-height:38px;padding:8px;margin:3px 0;background:#191d26;color:#eee;border:1px solid #343946;border-radius:7px;font:inherit}button{cursor:pointer;touch-action:manipulation}button:hover{filter:brightness(1.12)}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#2b6ff3}.long{background:#17422c}.short{background:#4b2025}.status{padding:8px;margin:6px 0;background:#161a22;border:1px solid #303540;border-radius:7px;font-size:12px}.green{color:#5bd48a}.red{color:#ff7180}.small{font-size:11px;color:#8d95a6}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:5px}.metric{background:#161a22;border:1px solid #303540;border-radius:6px;padding:6px}.metric b{display:block;font-size:14px}.history-list{max-height:220px;overflow:auto;font-size:11px}.trade{display:grid;grid-template-columns:38px 1fr 60px 60px;gap:5px;padding:5px 0;border-bottom:1px solid #252a34}.notice{padding:7px;background:#2c2a1e;border:1px solid #5c5432;border-radius:6px;font-size:11px;margin:6px 0}h3{font-size:13px;margin:4px 0 7px}label{font-size:10px;color:#9da5b5}.history-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}@media(max-width:768px) and (orientation:portrait){header{height:48px;flex-basis:48px;padding:0 8px;gap:7px}header b{font-size:13px}header .muted{font-size:10px}.tfbar{gap:3px}.tfbar button{min-width:0;flex:1;padding:6px 5px;font-size:11px}main{grid-template-columns:1fr;grid-template-rows:minmax(0,54fr) minmax(260px,46fr)}.side{border-left:0;border-top:1px solid #2a2e38;padding:8px}.chart-info{left:6px;top:6px;font-size:9px;padding:4px 6px}.section{padding-bottom:7px;margin-bottom:7px}button,input,select{min-height:44px}.history-list{max-height:110px}}@media(max-width:900px) and (orientation:landscape){header{height:42px;flex-basis:42px;padding:0 8px;gap:7px}header b{font-size:12px}.tfbar{gap:3px}.tfbar button{min-width:0;flex:1;padding:5px 6px;font-size:10px}main{grid-template-columns:minmax(0,1fr) minmax(270px,32vw)}.side{padding:8px}.chart-info{font-size:9px}.section{padding-bottom:6px;margin-bottom:6px}button,input,select{min-height:36px;padding:6px}.history-list{max-height:90px}}</style></head><body><header><b>FX Simulator</b><span id="tfLabel" class="muted">USDJPY · M5</span><div class="tfbar" id="tfBar"></div></header><main><div id="chart"><canvas id="canvas"></canvas><div class="chart-info" id="chartInfo">M5 · --</div></div><aside class="side">
<div class="section"><h3>セッション</h3><button id="randomBtn" class="primary">🎲 ランダム開始 / リセット</button><div id="notice" class="notice">2009年〜のM5ヒストリカルデータ · 表示ローソク足 500本固定</div><div class="status" id="status">読み込み中…</div></div>
<div class="section"><h3>方向</h3><div class="grid"><button id="long" class="long">LONG</button><button id="short" class="short">SHORT</button></div><label>Entry</label><input id="entry" type="number" step=".001"><label>TP</label><input id="tp" type="number" step=".001"><label>SL</label><input id="sl" type="number" step=".001"><div class="grid"><button id="enter" class="primary">エントリー</button><button id="skip">見送り</button></div></div>
<div class="section"><h3>バー送り</h3><div class="grid"><button id="a1">▶ 1本</button><button id="a5">▶▶ 5本</button></div><div class="grid"><button id="a10">▶▶▶ 10本</button><button id="until">決済まで</button></div><div class="status" id="result">未決済</div><div class="small">Space=1本 / L=LONG / S=SHORT / E=エントリー</div></div>
<div class="section"><h3>成績</h3><div class="metrics"><div class="metric">Trades<b id="trades">0</b></div><div class="metric">Win rate<b id="win">0.0%</b></div><div class="metric">PF<b id="pf">—</b></div><div class="metric">Net R<b id="net">0.00R</b></div><div class="metric">Max DD<b id="dd">0.00R</b></div><div class="metric">Best streak<b id="streak">0</b></div></div></div>
<div class="section"><h3>トレード履歴</h3><div class="history-actions"><button id="csvBtn">CSV出力</button><button id="clearBtn">履歴全削除</button></div><div class="history-list" id="history"><div class="small">まだありません</div></div></div></aside></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const el={chart:$('chart'),cv:$('canvas'),tf:$('tfLabel'),chartInfo:$('chartInfo'),bar:$('tfBar'),random:$('randomBtn'),notice:$('notice'),status:$('status'),long:$('long'),short:$('short'),entry:$('entry'),tp:$('tp'),sl:$('sl'),enter:$('enter'),skip:$('skip'),a1:$('a1'),a5:$('a5'),a10:$('a10'),until:$('until'),result:$('result'),trades:$('trades'),win:$('win'),pf:$('pf'),net:$('net'),dd:$('dd'),streak:$('streak'),history:$('history')};const ctx=el.cv.getContext('2d');const tfs=['M1','M5','M15','H1','H4'];const mins={M5:5,M15:15,H1:60,H4:240};let st={tf:'M5',current:0,bars:[],side:null,trade:null,loading:false};let viewStart=0,viewCount=500,lastRange=null,drag=null;let pointers=new Map(),pinch=null;const stat={ts:[],eq:0,peak:0,maxdd:0};const STORE='fx_simulator_trades_v2';
function buildTF(){el.bar.innerHTML='';tfs.forEach(tf=>{const b=document.createElement('button');b.textContent=tf;b.id='tf_'+tf;b.className=tf==='M1'?'unavailable':'';b.onclick=()=>tf==='M1'?el.notice.textContent='M1はM1元データが必要です。現在のデータはM5です。':changeTF(tf);el.bar.appendChild(b)})}function active(){tfs.forEach(tf=>{const b=$('tf_'+tf);if(b)b.classList.toggle('active',tf===st.tf)})}function timeStr(b){return b.date+' '+b.time}function ts(b){return Date.parse(b.date.replaceAll('.','-')+'T'+b.time+':00Z')/1000}
function resize(){const r=el.chart.getBoundingClientRect(),d=devicePixelRatio||1;el.cv.width=r.width*d;el.cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);draw()}addEventListener('resize',resize);
function priceRange(data){let hi=-Infinity,lo=Infinity;data.forEach(b=>{hi=Math.max(hi,b.high);lo=Math.min(lo,b.low)});[st.trade?.entry,st.trade?.tp,st.trade?.sl].forEach(v=>{if(v!=null){hi=Math.max(hi,v);lo=Math.min(lo,v)}});const p=(hi-lo)*.08||.1;return [hi+p,lo-p]}
function draw(){const w=el.chart.clientWidth,h=el.chart.clientHeight;ctx.clearRect(0,0,w,h);ctx.fillStyle='#0f1117';ctx.fillRect(0,0,w,h);if(!st.bars.length)return;const start=Math.max(0,Math.min(viewStart,Math.max(0,st.bars.length-viewCount))),data=st.bars.slice(start,start+viewCount);const [hi,lo]=priceRange(data),left=62,right=12,top=24,bottom=28,pw=w-left-right,ph=h-top-bottom;lastRange={hi,lo,left,top,pw,ph};const py=p=>top+(hi-p)/(hi-lo)*ph;ctx.font='11px system-ui';ctx.strokeStyle='#1e222b';ctx.fillStyle='#8f98aa';for(let i=0;i<=5;i++){const y=top+ph*i/5;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(w-right,y);ctx.stroke();ctx.fillText((hi-(hi-lo)*i/5).toFixed(3),5,y+4)}const step=pw/data.length,cw=Math.max(2,step*.65);data.forEach((b,i)=>{const x=left+step*(i+.5),yo=py(b.open),yc=py(b.close);ctx.strokeStyle=ctx.fillStyle=b.close>=b.open?'#26a69a':'#ef5350';ctx.beginPath();ctx.moveTo(x,py(b.high));ctx.lineTo(x,py(b.low));ctx.stroke();ctx.fillRect(x-cw/2,Math.min(yo,yc),cw,Math.max(1,Math.abs(yc-yo)))});[['Entry',st.trade?.entry],['TP',st.trade?.tp],['SL',st.trade?.sl]].forEach(([name,p])=>{if(p==null)return;const y=py(p);ctx.setLineDash([6,4]);ctx.strokeStyle=name==='TP'?'#5bd48a':name==='SL'?'#ff7180':'#e7e9ee';ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(w-right,y);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=ctx.strokeStyle;ctx.fillText(name+' '+p.toFixed(3),w-115,Math.max(14,y-3))});el.chartInfo.textContent=st.tf+' · '+(data.at(-1)?.date||'')+' '+(data.at(-1)?.time||'');el.status.innerHTML=`現在時刻: <b>${st.bars.at(-1)?.date} ${st.bars.at(-1)?.time}</b><br>時間軸: ${st.tf} · 表示 ${st.bars.length}本<br>未来: <b>非表示</b>`}
function priceY(y){if(!lastRange)return 0;return lastRange.hi-(y-lastRange.top)/lastRange.ph*(lastRange.hi-lastRange.lo)}function nearLine(y){const p=priceY(y),tol=Math.max((lastRange.hi-lastRange.lo)*.015,.005);let n=null,d=Infinity;['entry','tp','sl'].forEach(k=>{const v=st.trade?.[k];if(v==null)return;const z=Math.abs(v-p);if(z<tol&&z<d){d=z;n=k}});return n}function setLine(k,p){if(!st.trade||!Number.isFinite(p))return;st.trade[k]=Number(p.toFixed(3));el[k].value=st.trade[k].toFixed(3);draw()}
function setSide(s){st.side=s;el.long.style.opacity=s==='LONG'?'1':'.55';el.short.style.opacity=s==='SHORT'?'1':'.55';const e=Number(el.entry.value);if(!e)return;if(s==='LONG'){el.tp.value=(e+.300).toFixed(3);el.sl.value=(e-.150).toFixed(3)}else{el.tp.value=(e-.300).toFixed(3);el.sl.value=(e+.150).toFixed(3)}}
async function api(u){const r=await fetch(u,{cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.detail||'API error');return j}
async function newSession(){if(st.loading)return;if(st.tf==='M1')return;st.loading=true;el.random.disabled=true;el.status.textContent='ランダム地点を読み込み中…';try{const x=await api(`/api/session?tf=${st.tf}&depth=500`);st.current=x.current_m5;st.bars=x.bars;st.side=null;st.trade=null;viewCount=500;viewStart=Math.max(0,st.bars.length-viewCount);const c=st.bars.at(-1).close;el.entry.value=c.toFixed(3);setSide('LONG');el.result.textContent='未決済';draw()}catch(e){el.status.textContent='読み込み失敗: '+e.message}finally{st.loading=false;el.random.disabled=false}}
async function changeTF(tf){st.tf=tf;el.tf.textContent='USDJPY · '+tf;active();st.loading=true;try{const x=await api(`/api/view?tf=${tf}&current=${st.current}&depth=500`);st.bars=x.bars;viewCount=500;viewStart=Math.max(0,st.bars.length-viewCount);draw()}catch(e){el.status.textContent='時間軸変更失敗: '+e.message}finally{st.loading=false}}
function enter(){const e=+el.entry.value,t=+el.tp.value,l=+el.sl.value;if(!st.side||![e,t,l].every(Number.isFinite))return alert('方向・価格を設定してください');if(st.side==='LONG'&&!(l<e&&e<t))return alert('LONGは SL < Entry < TP');if(st.side==='SHORT'&&!(t<e&&e<l))return alert('SHORTは TP < Entry < SL');const b=st.bars.at(-1);st.trade={side:st.side,entry:e,tp:t,sl:l,entryTime:b?timeStr(b):'',entryTf:st.tf};el.result.textContent='OPEN '+st.side+' @ '+e.toFixed(3);draw()}
function saveRecords(){try{localStorage.setItem(STORE,JSON.stringify(stat.ts))}catch(e){} }function rebuildStats(){stat.eq=0;stat.peak=0;stat.maxdd=0;for(const x of stat.ts){stat.eq+=Number(x.R)||0;stat.peak=Math.max(stat.peak,stat.eq);stat.maxdd=Math.min(stat.maxdd,stat.eq-stat.peak)}}function loadRecords(){try{const a=JSON.parse(localStorage.getItem(STORE)||'[]');if(Array.isArray(a)){stat.ts=a;rebuildStats()}}catch(e){stat.ts=[]}stats();history()}function csvCell(v){return '"'+String(v??'').replaceAll('"','""')+'"'}function exportCSV(){const h=['No','エントリー時刻','時間足','方向','Entry','TP','SL','決済時刻','Exit','結果','R'];const rows=stat.ts.map((x,i)=>[i+1,x.entryTime,x.entryTf,x.side,x.entry,x.tp,x.sl,x.exitTime,x.exit,x.result,x.R]);const csv='\ufeff'+[h,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='fx_simulator_trade_history.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function clearRecords(){if(!stat.ts.length)return;if(!confirm('トレード履歴をすべて削除しますか？'))return;stat.ts=[];rebuildStats();saveRecords();stats();history()}function record(res,exit){const t=st.trade,risk=Math.abs(t.entry-t.sl),p=t.side==='LONG'?exit-t.entry:t.entry-exit,R=risk?p/risk:0;const b=st.bars.at(-1);stat.ts.push({side:t.side,result:res,entry:t.entry,tp:t.tp,sl:t.sl,entryTime:t.entryTime,entryTf:t.entryTf,exitTime:b?timeStr(b):'',exit,R});stat.eq+=R;stat.peak=Math.max(stat.peak,stat.eq);stat.maxdd=Math.min(stat.maxdd,stat.eq-stat.peak);saveRecords();stats();history()}
async function advance(n){if(st.loading||!st.bars.length)return;st.loading=true;[el.a1,el.a5,el.a10,el.until].forEach(x=>x.disabled=true);const q=new URLSearchParams({tf:st.tf,current:st.current,steps:n});if(st.trade)Object.entries(st.trade).forEach(([k,v])=>q.set(k,v));try{const x=await api('/api/advance?'+q);if(x.bars?.length){st.bars.push(...x.bars);st.current=x.new_current;viewStart=Math.max(0,st.bars.length-viewCount)}if(x.result&&st.trade){record(x.result,x.exit);el.result.innerHTML=x.result==='WIN'?`<span class="green">WIN</span> @ ${x.exit.toFixed(3)}`:`<span class="red">LOSS</span> @ ${x.exit.toFixed(3)}`;st.trade=null}draw()}catch(e){el.result.innerHTML='<span class="red">'+e.message+'</span>'}finally{st.loading=false;[el.a1,el.a5,el.a10,el.until].forEach(x=>x.disabled=false)}}async function until(){if(!st.trade)return alert('先にエントリーしてください');let i=0;while(st.trade&&i++<100)await advance(50)}
function stats(){const t=stat.ts,w=t.filter(x=>x.result==='WIN'),l=t.filter(x=>x.result==='LOSS'),gw=w.reduce((a,x)=>a+x.R,0),gl=l.reduce((a,x)=>a+Math.abs(x.R),0);el.trades.textContent=t.length;el.win.textContent=(t.length?w.length/t.length*100:0).toFixed(1)+'%';el.pf.textContent=gl?(gw/gl).toFixed(2):'—';el.net.textContent=stat.eq.toFixed(2)+'R';el.dd.textContent=stat.maxdd.toFixed(2)+'R';let c=0,b=0;t.forEach(x=>{c=x.result==='WIN'?c+1:0;b=Math.max(b,c)});el.streak.textContent=b}function history(){el.history.innerHTML=stat.ts.slice().reverse().map((x,i)=>`<div class="trade"><span>#${stat.ts.length-i}</span><span>${x.entryTf||''}</span><span>${x.entryTime||''}</span></div>`).join('')||'<div class="small">まだありません</div>'}
function bind(){el.random.onclick=newSession;el.long.onclick=()=>setSide('LONG');el.short.onclick=()=>setSide('SHORT');el.enter.onclick=enter;el.skip.onclick=()=>st.trade?alert('決済してから見送りしてください'):(el.result.textContent='見送り',advance(1));el.a1.onclick=()=>advance(1);el.a5.onclick=()=>advance(5);el.a10.onclick=()=>advance(10);el.until.onclick=until;el.csv.onclick=exportCSV;el.clear.onclick=clearRecords;el.cv.addEventListener('pointerdown',e=>{const r=el.cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;pointers.set(e.pointerId,{x,y});try{el.cv.setPointerCapture(e.pointerId)}catch(_){}if(pointers.size>=2){drag=null;const a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),c={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};if(d){const px=lastRange.pw/viewCount;pinch={startDist:d,startCount:viewCount,startCenterIndex:viewStart+(c.x-lastRange.left)/px}}return}const k=nearLine(y);if(k){drag={type:'line',k,pid:e.pointerId};el.chart.style.cursor='ns-resize'}else{drag={type:'pan',x,start:viewStart,pid:e.pointerId};el.chart.style.cursor='grabbing'}});el.cv.addEventListener('pointermove',e=>{const r=el.cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(pointers.has(e.pointerId))pointers.set(e.pointerId,{x,y});if(pointers.size>=2&&pinch){const a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(d){const next=Math.max(40,Math.min(st.bars.length,Math.round(pinch.startCount*pinch.startDist/d)));viewCount=next;viewStart=Math.max(0,Math.min(st.bars.length-viewCount,Math.round(pinch.startCenterIndex-viewCount/2)));draw()}return}if(!drag)return;if(drag.type==='line')setLine(drag.k,priceY(y));else{const px=lastRange.pw/viewCount;const shift=Math.round(-(x-drag.x)/px);viewStart=Math.max(0,Math.min(st.bars.length-viewCount,drag.start+shift));draw()}});['pointerup','pointercancel'].forEach(ev=>el.cv.addEventListener(ev,e=>{pointers.delete(e.pointerId);if(pointers.size<2)pinch=null;if(!pointers.size){drag=null;el.chart.style.cursor='grab'}}));el.cv.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY>0?1.2:.83,c=viewStart+viewCount/2;viewCount=Math.max(40,Math.min(st.bars.length,Math.round(viewCount*f)));viewStart=Math.max(0,Math.min(st.bars.length-viewCount,Math.round(c-viewCount/2)));draw()},{passive:false});document.addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();advance(1)}if(e.key.toLowerCase()==='l')setSide('LONG');if(e.key.toLowerCase()==='s')setSide('SHORT');if(e.key.toLowerCase()==='e')enter()})}
buildTF();bind();active();resize();loadRecords();newSession();
})();</script></body></html>
